[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "loadfx"
version = "1.0.0"
description = "Terminal loading effects, text effects, progress bars, and interactive menus."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "Tivalsdeveloper"}]
keywords = ["terminal", "loading", "spinner", "text-effects", "menu", "cli"]

[tool.setuptools.packages.find]
include = ["loadfx*"]
